name: nodos
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_dotenv: ^5.2.1
  flutter_markdown: ^0.7.7+1
  flutter_riverpod: ^3.4.2
  google_generative_ai: ^0.4.0
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "Logo aplicación grafos.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "Logo aplicación grafos.png"
  windows:
    generate: true
    image_path: "Logo aplicación grafos.png"
    icon_size: 48

flutter:
  uses-material-design: true
  assets:
    - Logo aplicación grafos.png
    - .env
